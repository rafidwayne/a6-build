name: Build Asphalt 6 fill-screen APK (v4 render-texture scaling)

# One-file build: this repository only needs THIS file. It downloads HyperHLE-Reborn
# v1.2.5, applies the Asphalt 6 fill-screen patch (embedded below) and builds the
# Android APK. Run it from the Actions tab -> "Build Asphalt 6 fill-screen APK" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout HyperHLE-Reborn v1.2.5
      uses: actions/checkout@v4
      with:
        repository: KlugKlugTG/HyperHLE-Reborn
        ref: v1.2.5
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Apply Asphalt 6 fill-screen patch
      run: |
        cat > a6.patch <<'PATCH_END_MARKER'
        diff --git a/OPTIONS_HELP.txt b/OPTIONS_HELP.txt
        index 8ddfae0..858b1ab 100644
        --- a/OPTIONS_HELP.txt
        +++ b/OPTIONS_HELP.txt
        @@ -28,6 +28,26 @@ View options:
                 and it will automatically rotate the window, but some apps neglect to
                 do this. These options may be useful in that case.
         
        +    --eagl-fill-screen / --no-eagl-fill-screen
        +        Makes the nib-loaded window and OpenGL ES view take the emulated
        +        screen's size, for apps that lay themselves out from the screen size
        +        (e.g. Asphalt 6 on a 16:9 device profile such as iPod touch 5) but
        +        whose nib still describes a 3.5-inch window.
        +
        +    --eagl-default-scale-1 / --no-eagl-default-scale-1
        +        Gives plain OpenGL ES views the iOS default pixel scale of 1.0 until
        +        the app asks for more, instead of the screen's retina scale.
        +
        +    --scale-hack-render-textures / --no-scale-hack-render-textures
        +        With --scale-hack=N, also enlarges modest colour textures an app
        +        renders into via a framebuffer object, and scales the viewport and
        +        scissor while drawing into them, so offscreen passes (e.g. a game that
        +        draws its 3D scene to a texture first) also get the higher resolution.
        +
        +    --skip-movies / --no-skip-movies
        +        Videos played with MPMoviePlayerController finish almost immediately,
        +        like a skip. For apps whose intro movies can't be skipped by tapping.
        +
             --scale-hack=...
                 Set a scaling factor for the window. touchHLE will attempt to run the
                 app with an increased internal resolution. This is a hack and there's
